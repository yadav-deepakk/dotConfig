set -g mouse on
set -g status-position bottom
set -g status-bg black
set -g window-status-separator " "

set -g status-left-length 30
set -g status-left ' #[fg=#7dcfff,bold]  #S #[fg=#565f89]|'
set -g status-right ' '

set -g status-left-length 0
set -g status-right-length 0
set -g status-justify left

setw -g window-status-format " #I:#W "
setw -g window-status-style "bg=default,fg=grey"
setw -g window-status-current-format '#[bg=#111111,fg=#e8e8e8,bold] #I:#W #[bg=#20252e,fg=#c0caf5]'

set -g message-style 'fg=#c0caf5,bg=#24283b'
set -g message-command-style 'fg=#c0caf5,bg=#24283b'

bind -n M-up switch-client -p
bind -n M-down switch-client -n
bind -n M-left previous-window
bind -n M-right next-window

